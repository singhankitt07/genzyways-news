<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenzyWayNews logo concepts</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#0f1115;background:#f6f3ed}*{box-sizing:border-box}body{margin:0;padding:32px}h1{font-family:Georgia,serif;font-size:clamp(2rem,5vw,4rem);margin:0 0 8px}p{color:#5c6470}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:1200px}.card{padding:20px;border:1px solid #d8d1c5;border-radius:16px;background:#fff}.dark{background:#171a21;color:#f2f4f7;border-color:#2a2f3a}.dark p{color:#a8b0bd}.mark{display:flex;align-items:center;justify-content:center;min-height:280px;border-radius:12px;background:#faf8f3}.dark .mark{background:#0f1115}.mark img{width:256px;height:256px;max-width:100%}.sizes{display:flex;align-items:end;gap:20px;margin-top:16px}.sizes img{object-fit:contain}.s16{width:16px;height:16px}.s24{width:24px;height:24px}.s32{width:32px;height:32px}.lockups{display:grid;gap:20px;max-width:1200px;margin:32px 0}.lockups img{width:100%;background:#0f1115;border-radius:12px;padding:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.mono{filter:grayscale(1) contrast(1.4)}@media(max-width:600px){body{padding:18px}.two{grid-template-columns:1fr}}
</style></head><body><h1>GenzyWayNews</h1><p>Signal. Context. Now. · Original brand exploration · A = Devanagari signal, E = signal-wave evolution.</p><section class="grid">
<script>
const concepts=[['a','Custom ज़ signal','The nukta becomes a broadcast dot.'],['b','Geometric G','The open G gap becomes a signal arc.'],['c','G + ज़ monogram','A compact bilingual-news stamp.'],['d','Breaking lightning','Speed and alert energy.'],['e','Signal wave','A bold evolution of the current icon.']];
for(const [id,name,note] of concepts)document.write(`<article class="card"><h2>${name}</h2><p>${note}</p><div class="mark"><img src="icon-${id}.svg" alt="${name}"></div><div class="sizes"><img class="s16" src="icon-${id}.svg" alt="16px"><img class="s24" src="icon-${id}.svg" alt="24px"><img class="s32" src="icon-${id}.svg" alt="32px"></div><div class="mark" style="margin-top:16px"><img class="mono" src="icon-${id}.svg" alt="${name} one color"></div></article><article class="card dark"><h2>${name} · dark</h2><p>${note}</p><div class="mark"><img src="icon-${id}.svg" alt="${name} dark"></div></article>`);
</script></section><h2>Lockups</h2><section class="lockups"><img src="lockup-a-horizontal.svg" alt="Concept A horizontal"><img src="lockup-e-horizontal.svg" alt="Concept E horizontal"><div class="two"><img src="lockup-a-stacked.svg" alt="Concept A stacked"><img src="lockup-e-stacked.svg" alt="Concept E stacked"></div><div class="two"><img src="lockup-a-bilingual.svg" alt="Concept A bilingual"><img src="lockup-e-bilingual.svg" alt="Concept E bilingual"></div></section></body></html>
